name: Staj Radar

on:
  schedule:
    - cron: "0 13 * * *"     # her gün 16:00 Türkiye saati (13:00 UTC); GitHub birkaç dakika geciktirebilir
  workflow_dispatch:         # elle çalıştırmak için

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testler
        run: python -I -m unittest discover -s tests

      - name: Tara ve bildir
        env:
          SITE_URL: https://hefetas.github.io/staj-radar
          SEND_DIGEST: ${{ github.event_name == 'schedule' && '1' || '' }}
          SUPABASE_URL: https://plaoulgdbgtpqhemfqix.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYW91bGdkYmd0cHFoZW1mcWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5OTQxMTgsImV4cCI6MjEwOTU3MDExOH0.M8qGu503nnnHGEvIwJN1a2tBcfXVDAvvVVxviB2vVF8
          STAJ_INGEST_TOKEN: ${{ secrets.STAJ_INGEST_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/radar.py
