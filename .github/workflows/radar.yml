name: Staj Radar

on:
  schedule:
    - cron: "17 */3 * * *"   # her 3 saatte bir (UTC)
  workflow_dispatch:         # Actions sekmesinden elle çalıştır

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testler
        run: python -I -m unittest discover -s tests

      - name: Tara ve bildir
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/radar.py

      - name: Veriyi depoya yaz
        run: |
          git config user.name "staj-radar[bot]"
          git config user.email "staj-radar@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Tarama: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
